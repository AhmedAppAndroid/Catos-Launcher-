name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { ver: v1.0, zip: CatosLauncher.zip, notes: "First version: liquid glass home, app drawer, pins and dock." }
          - { ver: v1.1, zip: CatosLauncher-v1.1.zip, notes: "Settings screen, Games section, hide apps, list view, web search and a fixed signing key." }
          - { ver: v1.2, zip: CatosLauncher-v1.2.zip, notes: "Tools sheet, rename apps, custom dock, calculator search, lock gesture, themes and secrets." }
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o "${{ matrix.zip }}"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Build
        working-directory: CatosLauncher
        run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: cp CatosLauncher/app/build/outputs/apk/debug/app-debug.apk "CATOS-Launcher-${{ matrix.ver }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: CATOS-Launcher-${{ matrix.ver }}
          path: CATOS-Launcher-${{ matrix.ver }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.ver }}
          name: CATOS Launcher ${{ matrix.ver }}
          body: ${{ matrix.notes }}
          files: CATOS-Launcher-${{ matrix.ver }}.apk
